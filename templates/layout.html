{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>{% block title %}TweetBar{% endblock %}</title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet" />
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <!-- Brand -->
                <a class="navbar-brand fw-bold" href="{% url 'tweet_list' %}">
                    TweetBar
                </a>

                <!-- Mobile Toggle -->
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navbar Content -->
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'tweet_list' %}">
                                Home
                            </a>
                        </li>

                        {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'tweet_create' %}">
                                Create Tweet
                            </a>
                        </li>
                        {% endif %}
                    </ul>

                    <!-- Search -->
                    <form
                        class="d-flex me-lg-3 mb-3 mb-lg-0"
                        role="search"
                        method="get"
                        action="{% url 'tweet_list' %}">
                        <input
                            class="form-control me-2"
                            type="search"
                            name="q"
                            placeholder="Search tweets..."
                            aria-label="Search" />

                        <button class="btn btn-outline-light" type="submit">
                            Search
                        </button>
                    </form>

                    <!-- Authentication -->
                    <div class="d-flex gap-2 mt-3 mt-lg-0">
                        {% if user.is_authenticated %}

                        <span class="navbar-text me-2">
                            Hi, {{ user.username }}
                        </span>

                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">
                                Logout
                            </button>
                        </form>

                        {% else %}

                        <a
                            href="{% url 'login' %}"
                            class="btn btn-outline-light">
                            Login
                        </a>

                        <a href="{% url 'register' %}" class="btn btn-primary">
                            Register
                        </a>

                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        <main class="container py-4">{% block content %} {% endblock %}</main>

        <!-- Bootstrap JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
