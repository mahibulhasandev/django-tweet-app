{% extends "layout.html" %}

{% block title %}Logged Out | Tweet App{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0 rounded-4">
                <div class="card-body text-center p-5">

                    <div class="mb-4">
                        <div class="bg-success-subtle rounded-circle d-inline-flex align-items-center justify-content-center"
                             style="width: 80px; height: 80px;">
                            <span class="text-success fs-1">✓</span>
                        </div>
                    </div>

                    <h2 class="fw-bold mb-3">
                        Logged Out!
                    </h2>

                    <p class="text-muted mb-4">
                        You have been successfully logged out
                        of your account.
                    </p>

                    <a href="{% url 'login' %}"
                       class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
                        Login Again
                    </a>

                    <p class="text-muted small mt-4 mb-0">
                        Thank you for visiting Tweet App!
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
