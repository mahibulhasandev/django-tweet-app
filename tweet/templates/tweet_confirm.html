{% extends 'layout.html' %}

{% block title %}Delete Tweet | Tweet App{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0 rounded-4">
                <div class="card-body text-center p-4 p-md-5">

                    <div class="mb-4">
                        <div class="bg-danger-subtle rounded-circle d-inline-flex align-items-center justify-content-center"
                             style="width: 80px; height: 80px;">
                            <span class="text-danger fs-1">!</span>
                        </div>
                    </div>

                    <h2 class="fw-bold mb-3">
                        Delete Tweet?
                    </h2>

                    <p class="text-muted mb-4">
                        Are you sure you want to delete this tweet?
                        This action cannot be undone.
                    </p>

                    <form method="post">
                        {% csrf_token %}

                        <div class="d-flex gap-2 justify-content-center">

                            <button type="submit"
                                    class="btn btn-danger px-4 py-2 rounded-3 fw-semibold">
                                Delete
                            </button>

                            <a href="{% url 'tweet_list' %}"
                               class="btn btn-outline-secondary px-4 py-2 rounded-3 fw-semibold">
                                Cancel
                            </a>

                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
