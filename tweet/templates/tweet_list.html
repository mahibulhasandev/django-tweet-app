{% extends 'layout.html' %} 
{% block title %} Tweet {% endblock %} 
{% block content %}
<h1 class="text-center text-white mt-8">Django Project</h1>

<a class="btn-primary mb-4" href="{% url 'tweet_create' %}">Create a tweet</a>

<div class="container row gap-3">
    {% for tweet in tweets %}
    <div class="card" style="max-width: 320px">
        {% if tweet.photo %}
        <img
            src="{{ tweet.photo.url }}"
            class="card-img-top"
            alt="Tweet photo" />
        {% endif %}

        <div class="card-body">
            <h4 class="card-title">{{ tweet.user.username }}</h4>
            <p class="card-text">{{ tweet.text }}</p>

            <a
                href="{% url 'tweet_edit' tweet.id %}"
                class="btn-solid theme-primary">
                Edit
            </a>

            <a
                href="{% url 'tweet_delete' tweet.id %}"
                class="btn-solid theme-danger">
                Delete
            </a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
