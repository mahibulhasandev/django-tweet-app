
{% extends 'layout.html' %}

{% block title %}Tweet List{% endblock %}

{% block content %}

<h2 class="text-center mb-4">All Tweets</h2>

<div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">

    {% for tweet in tweets %}
        <div class="col">
            <div class="card h-100 shadow-sm">

                {% if tweet.photo %}
                    <img
                        src="{{ tweet.photo.url }}"
                        class="card-img-top"
                        alt="Tweet image"
                        style="height: 200px; object-fit: cover;">
                {% endif %}

                <div class="card-body">
                    <p class="card-text">{{ tweet.text }}</p>
                </div>

                <div class="card-footer">
                    <small class="text-muted">
                        {{ tweet.created_at }}
                    </small>
                </div>

            </div>
        </div>
    {% empty %}
        <p class="text-center">No tweets available.</p>
    {% endfor %}

</div>

{% endblock %}
